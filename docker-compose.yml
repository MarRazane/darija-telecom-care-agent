services:
  db:
    image: postgres:16
    container_name: dzmobile-db
    environment:
      POSTGRES_USER: dzmobile
      POSTGRES_PASSWORD: dzmobile
      POSTGRES_DB: dzmobile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dzmobile"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
